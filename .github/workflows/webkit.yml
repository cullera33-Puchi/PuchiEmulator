name: Pruebas con WebKit

# Las pruebas de navegador con WebKit, el motor de Safari (v0.41.0), en cada envío. Van aparte de la
# publicación: un fallo aquí avisa (cruz roja en GitHub) pero no la para. Es el WebKit de Linux, no el
# Safari del iPhone; lo que no puede hacer, la prueba lo salta con su motivo.

on:
  push:
  workflow_dispatch:
    inputs:
      prueba:
        description: Solo las pruebas cuyo nombre contenga esto (vacío, todas)
        required: false
        default: ''

jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps webkit
      - run: npm run e2e:webkit -- --trace off ${PRUEBA:+-g "$PRUEBA"}
        env:
          PRUEBA: ${{ inputs.prueba }}
      # Si falla, cómo estaba la página (v0.46.0): aquí no se puede ejecutar WebKit
      - if: always()
        run: find test-results \( -name error-context.md -o -name registro.txt -o -name eventos.txt -o -name sonda.txt \) -exec sh -c 'echo "== $1"; cat "$1"' _ {} \;
