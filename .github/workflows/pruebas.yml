name: Pruebas

# Tests, build y pruebas de navegador en cada envío a una rama que no es main (main ya las pasa al publicar).

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --trace off
